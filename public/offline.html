<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#002B49" />
  <title>Offline · Academic OS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f8fafc;
      background: radial-gradient(circle at 20% 20%, #0b4a73 0%, #002B49 45%, #020617 100%);
    }
    .card {
      text-align: center; padding: 40px 32px; max-width: 380px; margin: 24px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px; backdrop-filter: blur(14px); box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 24px; color: #cbd5e1; line-height: 1.5; }
    button {
      cursor: pointer; border: 0; border-radius: 12px; padding: 12px 28px; font-size: 1rem; font-weight: 600;
      color: #002B49; background: #F59E0B; transition: transform .15s ease, box-shadow .15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245,158,11,0.4); }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="Academic OS logo" />
    <h1>You're offline</h1>
    <p>Academic OS needs an internet connection to load your data. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
